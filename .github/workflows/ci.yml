name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the Python pinned in .python-version and the locked
      # dependencies. --locked fails if uv.lock is out of date with pyproject.
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
