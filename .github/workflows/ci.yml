name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-frontend
          path: frontend/dist

  # The built reviewer in Chromium against the real backend, on synthetic demo
  # data. Playwright's webServer builds the page, seeds the demo and starts it.
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces
          path: frontend/test-results

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. gitleaks scans commits, not the working tree, and a
          # key deleted in a later commit is still a leaked key.
          fetch-depth: 0

      # GitHub's own secret scanning isn't available on a private repo outside
      # Enterprise, so we run gitleaks ourselves. See docs/decisions/D004.
      # First step in the job: a leak fails before we pay for dependencies.
      # --redact keeps whatever it finds out of the build log.
      - name: Scan for secrets
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --no-banner .

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Installs the Python pinned in .python-version and the locked
      # dependencies. --locked fails if uv.lock is out of date with pyproject.
      - run: uv sync --locked

      - run: uv run ruff check .
      - run: uv run ruff format --check .
      # Coverage is reported, not enforced: a % gate would reward tests that
      # execute lines without checking them. See the Test Plan in Linear.
      - run: uv run pytest --cov=survey --cov-branch --cov-report=term-missing
      # Exercise the committed dataset too, including empty-region failures.
      - run: uv run survey validate-results results
      # A second extractor's run sits in its own folder (D025).
      - run: for dir in results/*/; do uv run survey validate-results "$dir" || exit 1; done
      # Same table on the run's Summary page, so nobody digs through the log.
      - run: uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  review-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Synthetic scans and a local bare Git remote, including Windows file locks.
      - run: uv run pytest tests/test_review_records.py tests/test_review_service.py tests/test_review_scans.py tests/test_review_rerun.py tests/test_review_sync.py tests/test_review_api.py tests/test_review_assets.py tests/test_review_frontend.py tests/test_review_benchmark.py tests/test_cli.py tests/test_record.py tests/test_output_schema.py
