[project]
name = "survey-card-extraction"
version = "0.1.0"
description = "Structured data extraction from the 1941-43 social survey cards, for University of Melbourne Archives"
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.21.0",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pypdf>=6.16.1",
]
# The local VLM candidates (torch, transformers, qwen_vl_utils) are deliberately
# absent: they are GPU-only, were never locked during IT-37, and every extractor
# imports them lazily behind is_available(). Install them by hand on the machine
# that runs them -- see backend/survey/extraction/qwen.py. Keeping them out is what
# holds `uv sync --locked` in CI to seconds.

[project.scripts]
survey = "survey.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Installed, not published (D024): installing is what lets `survey.*` import
# from anywhere without path edits.
module-name = "survey"
module-root = "backend"

[tool.pytest.ini_options]
testpaths = ["tests"]
# survey is installed; only the calibration harness, which is never packaged,
# needs to be on the path for its tests.
pythonpath = ["benchmark"]

[tool.pyright]
# Same path, so editors resolve the imports pytest already resolves.
extraPaths = ["benchmark"]

[tool.ruff]
# So isort files survey and the harness modules as first-party.
src = ["backend", "benchmark"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
