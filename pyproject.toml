[project]
name = "survey-card-extraction"
version = "0.1.0"
description = "Structured data extraction from the 1941-43 social survey cards, for University of Melbourne Archives"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=12.3.0",
    "pypdf>=6.16.1",
]

[tool.uv]
# Application, not a library - nothing here gets packaged or published.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.pyright]
extraPaths = ["src"]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
