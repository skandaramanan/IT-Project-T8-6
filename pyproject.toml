[project]
name = "survey-card-extraction"
version = "0.1.0"
description = "Structured data extraction from the 1941-43 social survey cards, for University of Melbourne Archives"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-ai-documentintelligence>=1.0.2",
    "openpyxl>=3.1.5",
    "pypdf>=6.16.1",
]

[tool.uv]
# Application, not a library - nothing here gets packaged or published.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "spike"]

[tool.pyright]
extraPaths = ["src", "spike"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
